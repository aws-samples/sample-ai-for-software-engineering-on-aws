<!doctype html>
<html lang="zh-CN" data-mode="dark" data-theme="kiro-dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>aidlc-team 看板预览</title>
    <style>
      /* KiroCrew's default themes (kiro-dark / kiro-light), copied from the dashboard's own stylesheet so
         the preview looks like the host. The page itself only reads these variables. */
      [data-theme='kiro-dark'] {
        --bg: #19161d; --bg-accent: #1c1922; --bg-elevated: #211d25; --bg-hover: #28242e; --card: #211d25; --card-fg: #f2f1f4;
        --panel: #211d25; --text: #dcdadf; --text-strong: #f2f1f4; --muted: #938f9b; --muted-strong: #5e5966; --border: #352f3d;
        --border-strong: #4a464f; --accent: #8e48ff; --accent-fg: #fff; --ok: #008543; --warn: #e0b94d; --danger: #f94359; --info: #6f9ae0;
        color-scheme: dark;
      }
      [data-theme='kiro-light'] {
        --bg: #fff; --bg-accent: #f5f5f5; --bg-elevated: #fff; --bg-hover: #f0f0f0; --card: #fff; --card-fg: #19161d; --panel: #fafafa;
        --text: #4a464f; --text-strong: #19161d; --muted: #5e5966; --muted-strong: #4a464f; --border: #e4e4e7; --border-strong: #d4d4d8;
        --accent: #8e48ff; --accent-fg: #fff; --ok: #008543; --warn: #a38a00; --danger: #d92544; --info: #285092;
        color-scheme: light;
      }
      :root {
        --font-body: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif;
        --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); }
      .pv-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 20px; font-size: 12px; color: var(--muted);
        border-bottom: 1px solid var(--border); background: var(--bg-elevated); }
      .pv-bar b { color: var(--text-strong); }
      .pv-bar a, .pv-bar button { font: inherit; color: var(--text); background: none; border: 1px solid var(--border); border-radius: 7px; padding: 2px 8px; cursor: pointer; text-decoration: none; }
      .pv-bar a[aria-current='true'], .pv-bar button[aria-pressed='true'] { border-color: var(--accent); color: var(--text-strong); background: color-mix(in srgb, var(--accent) 18%, transparent); }
      .pv-step { font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
