# Fact entries extracted from VSTATD-IF rev 1.3. Synthetic, written for this sample.
# Every entry cites its page and section; tools/check_knowledge.py verifies them.
rules:
- id: GW-SOCKET
  statement: vstatd connects to the Unix stream socket /run/cc1-gwd/can.sock as a client and never writes to it.
  source: '[VSTATD-IF p.3 §2.1]'
- id: GW-RECORD-FORMAT
  statement: Gateway records are text lines; frame "F <t_us> <can_id hex> <dlc 0-8> <2*dlc hex digits>", heartbeat
    "H <t_us>"; hexadecimal digits in upper or lower case.
  source: '[VSTATD-IF p.3 §2.2]'
- id: GW-BIT-ORDER
  statement: Signals are little-endian (Intel); bit 0 is the least significant bit of byte 0.
  source: '[VSTATD-IF p.3 §2.3]'
- id: GW-HEARTBEAT
  statement: The gateway sends a heartbeat record every 100 ms.
  values: {period_ms: 100}
  source: '[VSTATD-IF p.3 §2.4]'
- id: GW-RECORD-INVALID
  statement: A record that does not match the format is discarded and logged as GATEWAY_RECORD_INVALID at most once
    per 10 s.
  values: {log_rate_limit_s: 10}
  source: '[VSTATD-IF p.3 §2.5]'
- id: GW-UNKNOWN-ID
  statement: A frame with a CAN ID not in the message table is ignored without a log entry.
  source: '[VSTATD-IF p.3 §2.5]'
- id: GW-SHORT-DLC
  statement: A frame with dlc below 8 for a known message is discarded and logged; signals keep value and status, and
    the frame does not count as received for timeout supervision.
  source: '[VSTATD-IF p.3 §2.5]'
- id: DEC-SCALING
  statement: Physical value = raw * factor + offset.
  source: '[VSTATD-IF p.6 §3.3]'
- id: DEC-INTEGER-PRODUCT
  statement: Raw values are at most 24 bits; for integer factors raw * factor stays below 2^32, so unsigned 32-bit
    arithmetic cannot overflow. Largest product 16777214 * 100 = 1677721400 (Vehicle.TraveledDistance).
  values: {max_raw_bits: 24, max_product: 1677721400}
  source: '[VSTATD-IF p.6 §3.3]'
- id: DEC-FRACTIONAL
  statement: Signals with a fractional factor are computed in double precision and published rounded to the decimals
    of the IPC formatting rule.
  source: '[VSTATD-IF p.6 §3.3]'
- id: DEC-SNA
  statement: A raw value equal to the SNA raw value is not scaled; the signal is UNAVAILABLE.
  source: '[VSTATD-IF p.6 §3.3]'
- id: STATUS-UNAVAILABLE
  statement: UNAVAILABLE before the first frame, after a message timeout or gateway loss, or when the raw value is SNA;
    no value published.
  source: '[VSTATD-IF p.6 §3.4]'
- id: STATUS-INVALID
  statement: INVALID when the raw value is not SNA but the physical value is outside the valid range, or a two-bit
    flag reads 2; no value published; never clamped.
  source: '[VSTATD-IF p.6 §3.4]'
- id: STATUS-INVALID-LOG
  statement: An INVALID signal is logged as SIGNAL_INVALID at most once per 10 s per signal.
  values: {log_rate_limit_s: 10}
  source: '[VSTATD-IF p.6 §3.4]'
- id: ENUM-LV-STATE
  statement: Vehicle.LowVoltageSystemState raw 0 UNDEFINED, 1 LOCK, 2 OFF, 3 ACC, 4 ON, 5 START, 6 error (INVALID),
    7 SNA; published as the VSS string.
  source: '[VSTATD-IF p.6 §3.5]'
- id: ENUM-SELECTED-GEAR
  statement: SelectedGear -1 reverse, 0 neutral, 126 park, 127 drive (VSS codes; this vehicle sends no single
    forward gears); any other value except SNA -128 is INVALID.
  source: '[VSTATD-IF p.6 §3.5]'
- id: ENUM-FLAGS
  statement: Two-bit flags 0 false, 1 true, 2 error, 3 SNA.
  source: '[VSTATD-IF p.6 §3.5]'
- id: SUP-TIMEOUT
  statement: When no usable frame of a message arrived for longer than its timeout, all its signals become
    UNAVAILABLE; SIGNAL_TIMEOUT is logged once per message; the next usable frame logs SIGNAL_RECOVERED once;
    timeouts are detected within 10 ms of expiry.
  values: {detection_ms: 10}
  source: '[VSTATD-IF p.7 §4.1]'
- id: SUP-GRACE
  statement: Supervision of a message starts at its first usable frame or 2.0 s after GATEWAY_CONNECTED, whichever is
    earlier; no SIGNAL_TIMEOUT before that. Without a usable frame the timeout counts from the start of
    supervision. Applies after every GATEWAY_CONNECTED.
  values: {grace_s: 2.0}
  source: '[VSTATD-IF p.7 §4.2]'
- id: SUP-GATEWAY-LOSS
  statement: No line of any kind, usable or not, for 500 ms, or socket closed or in error, gives GATEWAY_LOST once;
    every signal UNAVAILABLE; the socket is closed; message timeouts are not logged separately meanwhile.
  values: {loss_ms: 500}
  source: '[VSTATD-IF p.7 §4.3]'
- id: SUP-RECONNECT
  statement: Reconnect after 100 ms, doubling up to 3200 ms, then every 3200 ms; success resets to 100 ms and logs
    GATEWAY_CONNECTED; GATEWAY_RETRY is logged once per outage, when the delay first reaches 3200 ms.
  values: {first_ms: 100, max_ms: 3200}
  source: '[VSTATD-IF p.7 §4.4]'
- id: SUP-CLOCK
  statement: Supervision uses the CC-1 monotonic clock, not gateway time or wall time.
  source: '[VSTATD-IF p.7 §4.5]'
- id: IPC-SOCKET
  statement: Listen on /run/vstatd/vstatd.sock, mode 0660, group vstat; text lines of at most 256 bytes including the
    newline.
  values: {max_line_bytes: 256}
  source: '[VSTATD-IF p.8 §5.1]'
- id: IPC-REQUESTS
  statement: Requests GET <path>, SUB <path> [<interval_ms>] (default 100, range 50 to 10000), UNSUB <path>, LIST
    (PATH <path> lines in signal table order, then OK). SUB on a subscribed path replaces its interval; UNSUB of a
    path not subscribed answers OK.
  values: {sub_default_ms: 100, sub_min_ms: 50, sub_max_ms: 10000}
  source: '[VSTATD-IF p.8 §5.2]'
- id: IPC-FORMAT
  statement: VAL <path> <value> <status> <t_ms>; value "-" unless AVAILABLE; two decimals for Vehicle.Speed and
    Vehicle.LowVoltageBattery.CurrentVoltage, one for state of charge and exterior temperature, none otherwise;
    t_ms is the CC-1 monotonic time since boot of the decoding step or timeout. After the OK of a SUB, one VAL with
    the current value follows at once.
  source: '[VSTATD-IF p.8 §5.3]'
- id: IPC-UPDATES
  statement: Updates on value or status change, at most once per interval with the latest value at the end of the
    interval; a change to UNAVAILABLE is sent at once.
  source: '[VSTATD-IF p.8 §5.3]'
- id: IPC-LIMITS
  statement: At most 16 clients and 32 subscriptions per client; outgoing queue of 256 lines per client, oldest
    dropped when full, CLIENT_QUEUE_OVERFLOW at most once per second per client; a slow client never blocks vstatd;
    idle clients are not disconnected.
  values: {max_clients: 16, max_subscriptions: 32, queue_lines: 256}
  source: '[VSTATD-IF p.8 §5.4]'
- id: ERR-CODES
  statement: E01 unknown request, E02 unknown path, E03 line too long, E04 too many subscriptions, E05 interval out of
    range, E06 too many clients (connection then closed); the connection stays open for E01 to E05.
  source: '[VSTATD-IF p.9 §6.1]'
- id: ERR-CLIENT-LOG
  statement: Every ERR response is logged as REQUEST_ERROR with its code, at most once per second per client; a client
    error never affects other clients or the gateway side.
  source: '[VSTATD-IF p.9 §6.2]'
- id: ERR-FATAL
  statement: Exit non-zero only when the IPC socket cannot be created at start-up or memory cannot be allocated; log
    SERVICE_STOP with the reason first.
  source: '[VSTATD-IF p.9 §6.4]'
- id: ERR-SUPPRESSED
  statement: An entry is written when no entry of the same kind (event with its signal, client or reason) was written
    within the rate limit; suppressed entries are counted and the next entry carries the count in "suppressed".
  source: '[VSTATD-IF p.9 §6.5]'
- id: LOG-EVENTS
  statement: The runtime log events and their fields are those of the event table.
  source: '[VSTATD-IF p.10 §7.1]'
- id: LOG-VALUES
  statement: SIGNAL_VALUE is logged on status change and when the raw value differs from the raw value last logged by
    at least the raw log deadband (deadband / factor); "any change" logs every change; subscriptions do not affect
    value logging.
  source: '[VSTATD-IF p.10 §7.2]'
- id: LOG-ORDER
  statement: Within one decoding step, SIGNAL_RECOVERED comes first, then the SIGNAL_VALUE entries in signal table
    order. A timeout writes SIGNAL_TIMEOUT, then the SIGNAL_VALUE entries; messages timing out in the same step follow
    message table order. GATEWAY_LOST comes before the SIGNAL_VALUE entries it causes.
  source: '[VSTATD-IF p.10 §7.3]'
- id: LOG-FIELDS
  statement: reason of GATEWAY_LOST is silence, closed or error; of GATEWAY_RECORD_INVALID format or short_dlc; of
    SERVICE_STOP signal, ipc_socket or out_of_memory. client is 1 for the first client since process start, counting
    up, never reused. raw is decimal, signed for signed signals. suppressed and dropped count since the previous entry
    of the same kind.
  source: '[VSTATD-IF p.10 §7.4]'
- id: START-READY
  statement: Log SERVICE_START, create the IPC socket, report readiness and log SERVICE_READY within 1.5 s; do not wait
    for the gateway; the gateway connection starts after SERVICE_READY.
  values: {ready_s: 1.5}
  source: '[VSTATD-IF p.11 §8.1]'
- id: STOP-SIGTERM
  statement: On SIGTERM stop accepting clients, close connections, log SERVICE_STOP with reason signal, exit 0 within
    500 ms.
  values: {stop_ms: 500}
  source: '[VSTATD-IF p.11 §8.2]'
- id: RES-MEMORY
  statement: Memory does not grow with frames received; it depends only on clients, subscriptions and queued lines.
  source: '[VSTATD-IF p.11 §8.3]'
- id: RES-THREADS
  statement: No threading model is prescribed; shared state is protected so that a client never receives a value and
    status from different decoding steps.
  source: '[VSTATD-IF p.11 §8.4]'
